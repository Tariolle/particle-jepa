project:
  name: particle-jepa
  run_name: particle_jepa_debug
  seed: 42

data:
  dataset: toy_particles
  num_train_trajectories: 100
  num_val_trajectories: 20
  trajectory_length: 100
  num_particles: 64
  dimension: 2
  dt: 0.01
  graph_radius: 0.15
  horizon: 1
  horizons: [1, 2, 4]
  batch_size: 6
  num_workers: 0
  bucketed_batches: true
  bucket_size: 128

model:
  type: particle_jepa
  node_input_dim: 7
  edge_input_dim: 6
  hidden_dim: 128
  latent_dim: 128
  message_passing_steps: 5
  mlp_layers: 2
  pooling: mean
  normalize_latents: true
  dropout: 0.0
  max_horizon: 32
  latent_predictor_steps: 5
  predictor_type: graph_transformer
  predictor_layers: 4
  predictor_heads: 4
  predictor_dropout: 0.1
  region_grid_size: 4

loss:
  type: prediction_sigreg
  prediction_weight: 1.0
  node_prediction_weight: 1.0
  region_prediction_weight: 1.0
  sigreg_weight: 0.05
  sigreg_sketch_dim: 64

optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.0001

training:
  epochs: 10
  grad_clip_norm: 1.0
  checkpoint_every: 5
  visualize_every: 5
  device: auto
  precision: fp16
  compile: true
  compile_scope: regional
  compile_required: true
  compile_mode: reduce-overhead
  regional_compile_mode: default
  compile_fullgraph: false
  compile_dynamic: true
  regional_compile_dynamic: true
  regional_compile_cudagraphs: false
  max_autotune_gemm_backends: ATEN
  preflight_warmup_batches: 1
  preflight_batches: 4
  preflight_max_epoch_seconds: 120
  preflight_max_peak_memory_mb: 6500
  slow_batch_seconds: 10
  max_oom_fraction: 0.02

tracking:
  provider: wandb
  enabled: false
  project: particle-jepa
  entity: null
  tags:
    - toy
    - particle-jepa
  mode: online

paths:
  run_root: runs

hydra:
  job:
    chdir: false
