project:
  name: particle-jepa
  run_name: waterramps_particle_jepa_probe
  seed: 42

data:
  dataset: learning_to_simulate
  data_root: data/raw/WaterRamps
  split: train
  horizon: 1
  graph_radius: null
  max_neighbors: null
  max_trajectories: 32
  sample_stride: 1
  max_samples_per_trajectory: 256
  normalize_acceleration: true
  kinematic_particle_id: 3
  input_sequence_length: 6
  num_particle_types: 9
  noise_std: 0.00067
  apply_noise: true
  use_official_features: true
  batch_size: 2
  num_workers: 0

model:
  type: particle_jepa
  node_input_dim: 23
  edge_input_dim: 3
  hidden_dim: 128
  latent_dim: 128
  message_passing_steps: 10
  mlp_layers: 2
  pooling: mean
  normalize_latents: true
  dropout: 0.0
  max_horizon: 32
  latent_predictor_steps: 2

loss:
  type: prediction_sigreg
  prediction_weight: 1.0
  node_prediction_weight: 1.0
  sigreg_weight: 0.05
  sigreg_sketch_dim: 64

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001

training:
  epochs: 25
  grad_clip_norm: 1.0
  checkpoint_every: 1
  visualize_every: 1
  device: auto
  precision: fp16
  compile: true
  compile_mode: reduce-overhead
  compile_fullgraph: false

tracking:
  provider: wandb
  enabled: false
  project: particle-jepa
  entity: null
  tags:
    - lts
    - waterramps
    - particle-jepa
  mode: online

paths:
  run_root: runs

hydra:
  job:
    chdir: false
