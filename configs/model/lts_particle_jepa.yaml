project:
  name: particle-jepa
  run_name: waterramps_particle_jepa_probe
  seed: 42

data:
  dataset: learning_to_simulate
  data_root: data/raw/WaterRamps
  split: train
  horizon: 1
  horizons: [1, 2, 4]
  graph_radius: null
  max_neighbors: null
  max_trajectories: 32
  sample_stride: 1
  max_samples_per_trajectory: 256
  normalize_acceleration: true
  kinematic_particle_id: 3
  input_sequence_length: 6
  num_particle_types: 9
  noise_std: 0.00067
  apply_noise: true
  use_official_features: true
  batch_size: 5
  num_workers: 6
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  bucketed_batches: true
  bucket_size: 256

model:
  type: particle_jepa
  node_input_dim: 23
  edge_input_dim: 3
  hidden_dim: 128
  latent_dim: 128
  message_passing_steps: 10
  mlp_layers: 2
  pooling: mean
  normalize_latents: true
  dropout: 0.0
  max_horizon: 32
  latent_predictor_steps: 5
  predictor_type: graph_transformer
  predictor_layers: 6
  predictor_heads: 4
  predictor_dropout: 0.1
  region_grid_size: 4

loss:
  type: prediction_sigreg
  prediction_weight: 1.0
  node_prediction_weight: 1.0
  region_prediction_weight: 1.0
  delta_prediction_weight: 0.25
  node_delta_prediction_weight: 0.5
  region_delta_prediction_weight: 0.25
  sigreg_weight: 0.05
  sigreg_sketch_dim: 64

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001

training:
  epochs: 25
  grad_clip_norm: 1.0
  checkpoint_every: 1
  visualize_every: 1
  device: auto
  precision: fp16
  compile: true
  compile_scope: regional
  compile_required: true
  compile_mode: reduce-overhead
  regional_compile_mode: default
  compile_fullgraph: false
  compile_dynamic: true
  regional_compile_dynamic: true
  regional_compile_cudagraphs: false
  cudagraph_skip_dynamic_graphs: true
  cudagraph_dynamic_shape_warn_limit: null
  max_autotune_gemm_backends: ATEN
  allow_tf32: true
  float32_matmul_precision: high
  preflight_warmup_batches: 4
  preflight_batches: 64
  preflight_min_batches_per_second: 1.0
  preflight_max_epoch_seconds: 600
  preflight_max_peak_memory_mb: 7500
  preflight_max_batch_seconds: 30
  slow_batch_seconds: 10
  max_epoch_seconds: 2400
  max_oom_fraction: 0.02
  resume_from: null

tracking:
  provider: wandb
  enabled: false
  project: particle-jepa
  entity: null
  tags:
    - lts
    - waterramps
    - particle-jepa
  mode: online

paths:
  run_root: runs

hydra:
  job:
    chdir: false
